<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="HTML">
    <meta name="description" content="contact form">
    <meta name="author" content="Rezy">
    <title>Contact Form | HTML</title>
</head>
<body>
    <header>
        <h1>Game Support</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="help.html">Help</a></li>
                <li><a href="form.html">Contact</a></li>
            </ul>
        </nav> <hr>
    </header>

    <main>
        <section>
            <h2>Contact Us</h2>
            <p>
                Send us a message and we will get back to you.
            </p>

            <form action="receive.html" method="post">
                <label for="fname">Fullname </label>
                <input type="text" name="fname" id="fname" placeholder="Your fullname" required> <br><br>
                <label for="email">Email </label>
                <input type="email" name="email" id="email" placeholder="name@example.com" required>  <br><br>
                <label for="subject">Subject </label>
                <select name="subject" id="subject">
                    <option value="feedback">Feedback</option>
                    <option value="bug">Bug issues</option>
                    <option value="security_support">Security Support</option>
                    <option value="purchases">In-Game Purchases</option>
                    <option value="violations">Report Violations</option>
                </select> <br> <br>
                <label for="message">Message</label>
                <textarea name="message" id="message" cols="30" rows="10" minlength="5" placeholder="Type your messages here" required></textarea> <br><br>
                <fieldset>
                    <legend>
                        How did you hear about us? 
                    </legend>
                        <input type="radio" name="website" id="website"> <label for="website">Website</label> <br>
                        <input type="radio" name="friends" id="friends"> <label for="friends">Friends</label> <br>
                        <input type="radio" name="social_media" id="social_media"> <label for="social_media">Social Media</label> <br>
                        <input type="radio" name="content_creator" id="content_creator"> <label for="content_creator">Content Creator</label> <br>
                        <input type="radio" name="forum" id="forum"> <label for="forum">Forum</label>
                </fieldset> <br><br>
                <input type="checkbox" name="newsletter" id="newsletter">
                <label for="newsletter">I want updates</label> <br> <br>
                <button type="submit">Send Message</button>
            </form>
            <br>
        </section>
    </main>
    <hr>
    <br>
    <br>

    <footer>
        &copy; 2026 Game Support
    </footer>
</body>
</html>
